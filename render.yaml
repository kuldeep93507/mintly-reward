services:
  - type: web
    name: ludo-mintly-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter # persistent disks need a paid plan
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ludo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SERVER_SECRET
        generateValue: true
      - key: OWNER_KEY # Ludo Admin login key (see docs/ADMIN.md); copy it from the Render dashboard
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: TURN_SECONDS
        value: "15"
      - key: BOT_FILL_SECONDS
        value: "12"
